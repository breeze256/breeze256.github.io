<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/stylesheets/main.css" />
    <title>brz256's Lab</title>
  </head>
  <body>
    <!-- Top nav -->
    <header>
      <nav id="nav_form" aria-label="Main navigation">
        <div>
          <input type="radio" name="nav" id="nav_home" value="#home" checked />
          <label class="nav_element" for="nav_home">01 Home</label>
        </div>
        <div>
          <input type="radio" name="nav" id="nav_lab" value="#lab" />
          <label class="nav_element" for="nav_lab">02 Lab</label>
        </div>
        <div>
          <input type="radio" name="nav" id="nav_about" value="#about" />
          <label class="nav_element" for="nav_about">03 About</label>
        </div>
      </nav>
    </header>

    <main>
      <section id="home">
        <h1>brz256's Lab</h1>
        <p>按下键盘任意键，底部对应键帽会亮起。</p>
        <p>试试 M 切换主题、H 隐藏键帽、+ / - 缩放。</p>
      </section>
      <section id="lab">
        <h2>Lab</h2>
        <p>这里放一些实验性的东西。</p>
      </section>
      <section id="about">
        <h2>About</h2>
        <p>brz256 的个人站点。</p>
      </section>
    </main>

    <!-- Keyboard Section -->
    <div id="keyboard_section">
      <div class="key_group">
        <div class="keys">
          <kbd data-key="1">1</kbd>
          <kbd data-key="2">2</kbd>
          <kbd data-key="3">3</kbd>
        </div>
        <p>To section</p>
      </div>
      <div class="key_group">
        <div class="keys">
          <kbd data-key="ArrowUp">↑</kbd>
          <kbd data-key="ArrowDown">↓</kbd>
          <kbd data-key="ArrowLeft">←</kbd>
          <kbd data-key="ArrowRight">→</kbd>
        </div>
        <p>Navigate</p>
      </div>
      <div class="key_group">
        <div class="keys">
          <kbd data-key="w">W</kbd>
          <kbd data-key="a">A</kbd>
          <kbd data-key="s">S</kbd>
          <kbd data-key="d">D</kbd>
        </div>
        <p>Scroll</p>
      </div>
      <div class="key_group">
        <div class="keys">
          <kbd data-key="+">+</kbd>
          <kbd data-key="-">-</kbd>
        </div>
        <p>Zoom</p>
      </div>
      <div class="key_group">
        <div class="keys"><kbd data-key="m">M</kbd></div>
        <p>Light/dark</p>
      </div>
      <div class="key_group">
        <div class="keys"><kbd data-key="h">H</kbd></div>
        <p>Hide keys</p>
      </div>
    </div>

    <script src="assets/javascripts/keyboard.js" defer></script>
  </body>
</html>
