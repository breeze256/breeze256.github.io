# Hexo Configuration

# Site.
title: breeze256's Blog
subtitle: "The website of breeze256."
description: "Built with Hexo."
keywords: ["Hexo", "Fullstack"]
author: breeze256
language: zh-CN
timezone: "Asia/Shanghai"

# URL.
url: https://breeze256.is-local.org/
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:

# Directory.
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts.
default_layout: post
titlecase: false # Transform title into titlecase.
external_link:
  enable: true # Open external links in new tab.
  field: site # Apply to the whole site.
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting.
index_generator:
  path: ''
  per_page: 5
  order_by: -date

# Category & Tag.
default_category: uncategorized
category_map:
tag_map:

# Metadata elements.
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta.
meta_generator: true

# Date / Time format.
## http://momentjs.com/docs/#/displaying/format/.
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'.
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination.
per_page: 5
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder.
include:
exclude:
ignore:

# Extensions.
## Theme.
theme: flat

## hexo-minify.
minify:
  preview: true

## hexo-renderer-dartsass.
sass:
  outputStyle: compressed # "expanded" or "compressed".

## hexo-excerpt.
excerpt:
  depth: 1

## hexo-filter-mathjax.
mathjax:
  tags: none # or 'ams' or 'all'
  single_dollars: true # enable single dollar signs as in-line math delimiters
  cjk_width: 0.9 # relative CJK char width
  normal_width: 0.6 # relative normal (monospace) width
  append_css: true # add CSS to pages rendered by MathJax
  every_page: false # if true, every page will be rendered by MathJax regardless the `mathjax` setting in Front-matter
  packages: # extra packages to load
  extension_options: {}
    # you can put your extension options here
    # see http://docs.mathjax.org/en/latest/options/input/tex.html#tex-extension-options for more detail

## hexo-abbrlink
abbrlink:
  alg: crc32 # Algorithm used to calc abbrlink. Support crc16(default) and crc32
  rep: hex # Representation of abbrlink in URLs. Support dec(default) and hex
  drafts: false # Whether to generate abbrlink for drafts. (false in default)
  force: false # Enable force mode. In this mode, the plugin will ignore the cache, and calc the abbrlink for every post even it already had an abbrlink. (false in default)
  writeback: true # Whether to write changes to front-matters back to the actual markdown files. (true in default)

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/breeze256/breeze256.github.io
